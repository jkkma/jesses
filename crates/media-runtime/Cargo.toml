[package]
name = "media-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
console-fixture = []

[dependencies]
media-core = { path = "../media-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
sha2 = "0.10"
base64 = "0.22"
dunce = "1"
icu_collator = "=2.3.0"
icu_locale_core = "=2.3.0"
dolby_vision = { version = "=3.4.0", default-features = false, features = ["serde"] }
hdr10plus = { version = "=2.1.5", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Environment", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[example]]
name = "windows_console_fixture"
required-features = ["console-fixture"]
