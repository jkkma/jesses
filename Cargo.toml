[workspace]
members = ["crates/media-core", "crates/media-runtime", "src-tauri"]
default-members = ["crates/media-core", "crates/media-runtime"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["jkkma"]
license = "GPL-3.0-only"
repository = "https://github.com/jkkma/jesses"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
ts-rs = { version = "12", features = ["serde-compat"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
