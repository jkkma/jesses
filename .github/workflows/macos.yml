name: macOS native checks and app archives

# macOS support is deferred; keep validation available for explicit manual runs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CARGO_BUILD_JOBS: '2'
      JESSES_MACOS_PACKAGE_DIR: jesses-macos-package-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15.2'
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install explicit external media dependencies
        run: |
          brew install ffmpeg-full mkvtoolnix x264 x265 aom libvpx svt-av1 tesseract
          # The full formula supplies AOM, Vorbis, libass and zimg. It is
          # keg-only, so select it explicitly instead of the reduced ffmpeg.
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: python3 scripts/test-package-macos.py
      - run: python3 scripts/test-ipc-registration.py
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: pnpm contracts:check
      - name: Verify native media outcomes
        run: |
          ffmpeg -version
          ffprobe -version
          cargo test -p media-runtime --test migration_encode --test analysis_jobs --test image_jobs --test mux_jobs --test ffmpeg_video_jobs --locked -- --include-ignored --test-threads=1
          cargo test -p media-runtime --test utility_jobs utility_batch_ --locked -- --ignored --test-threads=1
      - name: Build ad-hoc signed native application
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app --config src-tauri/tauri.macos.conf.json
      - name: Verify exact app and create development archive
        # Keep the fresh archive destination outside the restored Cargo cache.
        run: python3 scripts/package-macos.py --app target/${{ matrix.target }}/release/bundle/macos/jesses.app --destination "$RUNNER_TEMP/$JESSES_MACOS_PACKAGE_DIR" --target ${{ matrix.target }} --native --launch-smoke
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: jesses-${{ matrix.target }}-development
          path: |
            ${{ runner.temp }}/${{ env.JESSES_MACOS_PACKAGE_DIR }}/*.tar.gz
            ${{ runner.temp }}/${{ env.JESSES_MACOS_PACKAGE_DIR }}/SHA256SUMS
            ${{ runner.temp }}/${{ env.JESSES_MACOS_PACKAGE_DIR }}/*.log
            ${{ runner.temp }}/${{ env.JESSES_MACOS_PACKAGE_DIR }}/payload/macos-package-manifest.json
          if-no-files-found: warn
          retention-days: 14
