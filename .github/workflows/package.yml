name: Native Windows desktop package

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/package-build
      PACKAGE_PROFILE: ${{ inputs.profile }}
      PACKAGE_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/package-build
      - run: pnpm install --frozen-lockfile
      - run: python scripts/test-package-desktop.py
      - name: Verify isolated Scoop qualification helpers
        run: python scripts/test-qualify-scoop.py
      - run: python scripts/test-package-toolchain.py
      - run: python scripts/test-package-av1-codecs.py
      - run: python scripts/test-package-grav1synth.py
      - run: python scripts/test-package-standalone.py
      - name: Verify additional Windows standalone delivery contracts
        run: python scripts/test-package-extra-encoders.py
      - run: python scripts/test-package-av1an.py
      - run: python scripts/test-package-av1an-scorers.py
      - run: python scripts/test-package-av1an-qtgmc.py
      - run: python scripts/test-package-vship.py
      - run: python scripts/test-package-mkvmerge.py
      - run: pnpm format:check
      - run: pnpm check
      - run: cargo test -p jesses --lib --locked paths::tests
      - name: Assemble pinned isolated Windows media compiler
        shell: bash
        run: python scripts/bootstrap-package-toolchain.py --destination "$RUNNER_TEMP/jesses-media-compiler"
      - name: Build static Windows FFmpeg pair and retain corresponding sources
        shell: bash
        run: python scripts/build-package-ffmpeg.py --destination "$RUNNER_TEMP/jesses-ffmpeg" --msys-root "$RUNNER_TEMP/jesses-media-compiler/msys64"
      - name: Build the exact source grain provider with private compatible libraries
        shell: bash
        run: |
          rustup toolchain install 1.98.1-x86_64-pc-windows-gnu --profile minimal --no-self-update
          python scripts/build-package-grav1synth.py --destination "$RUNNER_TEMP/jesses-grav1synth" --msys-root "$RUNNER_TEMP/jesses-media-compiler/msys64"
      - name: Build standalone Windows x264 using the same pinned sources
        shell: bash
        run: python scripts/build-package-x264.py --destination "$RUNNER_TEMP/jesses-x264" --ffmpeg-build "$RUNNER_TEMP/jesses-ffmpeg/delivery" --msys-root "$RUNNER_TEMP/jesses-media-compiler/msys64"
      - name: Build pinned mainline Windows SVT-AV1
        shell: bash
        run: python scripts/build-package-svt.py --destination "$RUNNER_TEMP/jesses-svt" --ffmpeg-build "$RUNNER_TEMP/jesses-ffmpeg/delivery" --msys-root "$RUNNER_TEMP/jesses-media-compiler/msys64"
      - name: Build source-complete Windows AOM, VPX and x265 CLIs
        shell: bash
        run: |
          for encoder in aom vpx x265; do
            python scripts/build-package-extra-encoders.py --encoder "$encoder" --destination "$RUNNER_TEMP/jesses-$encoder" --ffmpeg-build "$RUNNER_TEMP/jesses-ffmpeg/delivery" --msys-root "$RUNNER_TEMP/jesses-media-compiler/msys64"
          done
      - name: Build portable Windows av1an and its complete frameserver sources
        shell: bash
        run: python scripts/build-package-av1an.py --destination "$RUNNER_TEMP/jesses-av1an" --ffmpeg-build "$RUNNER_TEMP/jesses-ffmpeg/delivery" --msys-root "$RUNNER_TEMP/jesses-media-compiler/msys64"
      - name: Build source-complete Windows CPU quality scorers
        shell: bash
        run: |
          python scripts/package-av1an-scorers.py --destination "$RUNNER_TEMP/jesses-scorers" --msys-root "$RUNNER_TEMP/jesses-media-compiler/msys64" --vapoursynth-source "$RUNNER_TEMP/jesses-av1an/frameserver/source/vapoursynth-acabf605b2205b32d65859bb2736405719d2fafd" --python "$RUNNER_TEMP/jesses-av1an/frameserver/python-input/tools/python.exe"
          python scripts/add-package-av1an-scorers.py --destination "$RUNNER_TEMP/jesses-av1an-scorers" --av1an-build "$RUNNER_TEMP/jesses-av1an/delivery" --scorers-build "$RUNNER_TEMP/jesses-scorers/delivery" --ffmpeg-build "$RUNNER_TEMP/jesses-ffmpeg/delivery" --msys-root "$RUNNER_TEMP/jesses-media-compiler/msys64"
      - name: Build and qualify source-complete Windows QTGMC dependencies
        shell: bash
        run: |
          python scripts/build-package-av1an-qtgmc.py --destination "$RUNNER_TEMP/jesses-qtgmc" --cache "$RUNNER_TEMP/jesses-qtgmc-cache"
          python scripts/package-av1an-qtgmc.py --destination "$RUNNER_TEMP/jesses-av1an-qtgmc" --av1an-build "$RUNNER_TEMP/jesses-av1an-scorers/delivery" --qtgmc-build "$RUNNER_TEMP/jesses-qtgmc/delivery" --ffmpeg-build "$RUNNER_TEMP/jesses-ffmpeg/delivery" --msys-root "$RUNNER_TEMP/jesses-media-compiler/msys64"
      - name: Package pinned Windows mkvmerge
        shell: bash
        run: python scripts/build-package-mkvmerge.py --destination "$RUNNER_TEMP/jesses-mkvmerge"
      - name: Verify native parallel scene detection with pinned Windows AV1AN and L-SMASH
        shell: pwsh
        run: |
          $delivery = Join-Path $env:RUNNER_TEMP 'jesses-av1an/delivery'
          $frameserver = Join-Path $delivery 'python/Lib/site-packages/vapoursynth'
          $ffmpeg = Join-Path $env:RUNNER_TEMP 'jesses-ffmpeg/delivery'
          $svt = Join-Path $env:RUNNER_TEMP 'jesses-svt/delivery'
          $mkvmerge = Join-Path $env:RUNNER_TEMP 'jesses-mkvmerge/delivery'
          # AV1AN validates its default encoder and concatenator even for --sc-only.
          $env:PATH = "$delivery;$frameserver;$ffmpeg;$svt;$mkvmerge;$env:PATH"
          $env:VSSCRIPT_PATH = Join-Path $frameserver 'vsscript.dll'
          $env:JESSES_TEST_AV1AN = Join-Path $delivery 'av1an.exe'
          cargo test -p media-runtime --lib --locked jobs::av1an::scenes::tests::native_parallel_prepass_covers_all_source_frames -- --ignored --exact --nocapture
      - name: Include optional Vulkan scoring with per-job CPU fallback
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/jesses-vship-cache"
          python scripts/build-package-vship.py --destination "$RUNNER_TEMP/jesses-vship" --cache "$RUNNER_TEMP/jesses-vship-cache"
          python scripts/package-av1an-vship.py --av1an-build "$RUNNER_TEMP/jesses-av1an-qtgmc/delivery" --vship-build "$RUNNER_TEMP/jesses-vship/delivery" --msys-root "$RUNNER_TEMP/jesses-media-compiler/msys64" --destination "$RUNNER_TEMP/jesses-av1an-vship"
      - name: Stage verified tools and complete source archives
        shell: bash
        run: |
          standalone_args=(--x264-build "$RUNNER_TEMP/jesses-x264/delivery" --svt-build "$RUNNER_TEMP/jesses-svt/delivery" --av1an-build "$RUNNER_TEMP/jesses-av1an-vship/delivery" --aom-build "$RUNNER_TEMP/jesses-aom/delivery" --vpx-build "$RUNNER_TEMP/jesses-vpx/delivery" --x265-build "$RUNNER_TEMP/jesses-x265/delivery" --mkvmerge-build "$RUNNER_TEMP/jesses-mkvmerge/delivery")
          python scripts/stage-bundled-tools.py --destination "$RUNNER_TEMP/jesses-bundled-tools" --target "$PACKAGE_TARGET" --ffmpeg-build "$RUNNER_TEMP/jesses-ffmpeg/delivery" --grav1synth-build "$RUNNER_TEMP/jesses-grav1synth/delivery" "${standalone_args[@]}"
      - name: Build native package discovery gate
        run: cargo build -p media-runtime --example package_tools --locked
      - name: Verify Windows bundled discovery with external tools unavailable
        shell: bash
        run: |
          python scripts/qualify-package-tools.py --probe "$CARGO_TARGET_DIR/debug/examples/package_tools.exe" --resources "$RUNNER_TEMP/jesses-bundled-tools" --require-media --require-tool x264 --require-tool svt-av1 --require-tool av1an --require-tool aomenc --require-tool vpxenc --require-tool x265 --require-tool mkvmerge --require-tool grav1synth
      - name: Qualify the packaged media pair with real files
        shell: bash
        run: |
          export JESSES_FFMPEG="$RUNNER_TEMP/jesses-bundled-tools/resources/tools/ffmpeg/ffmpeg.exe"
          export JESSES_FFPROBE="$RUNNER_TEMP/jesses-bundled-tools/resources/tools/ffmpeg/ffprobe.exe"
          export JESSES_X264="$RUNNER_TEMP/jesses-bundled-tools/resources/tools/x264/x264.exe"
          export JESSES_SVT_AV1="$RUNNER_TEMP/jesses-bundled-tools/resources/tools/svt-av1/SvtAv1EncApp.exe"
          export JESSES_SVT_AV1_5FISH="$RUNNER_TEMP/jesses-bundled-tools/resources/tools/svt-av1-5fish/SvtAv1EncApp.exe"
          export JESSES_SVT_AV1_HDR="$RUNNER_TEMP/jesses-bundled-tools/resources/tools/svt-av1-hdr/SvtAv1EncApp.exe"
          export JESSES_GRAIN_RESOURCES="$RUNNER_TEMP/jesses-bundled-tools"
          cargo test -p media-runtime --test grain_provider --locked -- --ignored --nocapture --test-threads=1
          export JESSES_GRAV1SYNTH="$RUNNER_TEMP/jesses-bundled-tools/resources/tools/grav1synth/grav1synth.exe"
          cargo test -p media-runtime --test utility_containers --locked -- --ignored --nocapture --test-threads=1
          cargo test -p media-runtime --test analysis_jobs --test bitrate_jobs --test loudness_jobs --test quality_jobs --test trim_jobs --test subtitle_jobs --test ffmpeg_video_jobs --test mux_jobs --test image_jobs --locked -- --ignored --test-threads=1
          # Bundled QTGMC is evaluated against real frames by the dependency merger above.
          cargo test -p media-runtime --test x264_jobs --test container_jobs --test temporal_jobs --test parameter_jobs --test rate_control_jobs --locked -- --include-ignored --test-threads=1 --skip qtgmc
          # Physical Vulkan and an external Dolby Vision fixture are separate equipped-host gates.
          # All headless HDR checks, including Auto fallback and held-Spline rejection, still run.
          test ! -e "$RUNNER_TEMP/jesses-no-vulkan-device.json"
          VK_DRIVER_FILES="$RUNNER_TEMP/jesses-no-vulkan-device.json" cargo test -p media-runtime --test tone_map_jobs --locked -- --include-ignored --test-threads=1 --skip selected_spline_uses_physical_vulkan_while_final_encoder_is_cpu --skip profile5_rpu_gpu_job_renders_complete_sdr_output
      - name: Qualify portable av1an with external tools and conflicting runtimes unavailable
        shell: pwsh
        run: |
          foreach ($testSuite in @('av1an_jobs', 'av1an_recovery', 'command_preview_jobs')) {
            $messages = cargo test -p media-runtime --test $testSuite --no-run --locked --message-format=json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'The portable av1an test runner failed to build.' }
            $runner = @($messages | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq $testSuite -and $_.executable })
            if ($runner.Count -ne 1) { throw 'Expected one exact native test runner.' }
            $gateArguments = @('scripts/qualify-package-av1an.py', '--runner', $runner[0].executable, '--resources', "$env:RUNNER_TEMP/jesses-bundled-tools", '--receipt', "$env:RUNNER_TEMP/jesses-portable-$testSuite.json")
            if ($testSuite -eq 'av1an_jobs') { $gateArguments += '--verify-video-only' }
            if ($testSuite -eq 'av1an_recovery') { $gateArguments += @('--skip-test', 'configured_source_readers_and_fixed_chunks_stop_reopen_and_resume') }
            python @gateArguments
            if ($LASTEXITCODE -ne 0) { throw 'The packaged av1an native gate failed.' }
          }
          $env:JESSES_TEST_TOOL_RESOURCES = "$env:RUNNER_TEMP/jesses-bundled-tools"
          cargo test -p media-runtime --lib --locked jobs::av1an::tests::basic_source_workflow_never_enters_either_detailed_proof -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'The packaged av1an verification policy gate failed.' }
      - name: Build portable application
        shell: bash
        run: |
          build_args=(--no-bundle)
          if [ "$PACKAGE_PROFILE" = debug ]; then build_args+=(--debug); fi
          pnpm tauri build --target "$PACKAGE_TARGET" --config "$RUNNER_TEMP/jesses-bundled-tools/tauri-tools.conf.json" "${build_args[@]}"
      - name: Assemble archives, resource manifests and checksums
        shell: bash
        run: python scripts/package-desktop.py collect --build-directory "$CARGO_TARGET_DIR/$PACKAGE_TARGET/$PACKAGE_PROFILE" --destination "$RUNNER_TEMP/jesses-packages" --target "$PACKAGE_TARGET" --profile "$PACKAGE_PROFILE" --tool-resources "$RUNNER_TEMP/jesses-bundled-tools/resources/tools"
      - name: Verify portable resources with a restricted tool search path
        shell: bash
        run: python scripts/package-desktop.py diagnostics "$RUNNER_TEMP/jesses-packages/portable" --sanitized-path
      - name: Verify native tool discovery from extracted package resources
        shell: bash
        run: |
          standalone_args=(--require-tool x264 --require-tool svt-av1 --require-tool grav1synth --require-tool av1an --require-tool aomenc --require-tool vpxenc --require-tool x265 --require-tool mkvmerge)
          python scripts/verify-bundle-resources.py --packages "$RUNNER_TEMP/jesses-packages" --probe "$CARGO_TARGET_DIR/debug/examples/package_tools.exe" --destination "$RUNNER_TEMP/jesses-extracted-bundles" --require-media "${standalone_args[@]}"
      - name: Retain native gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jesses-x86_64-pc-windows-msvc-native-gate-evidence
          path: |
            ${{ runner.temp }}/jesses-portable-*.json
            ${{ runner.temp }}/jesses-portable-*.log
            ${{ runner.temp }}/jesses-ffmpeg/build.log
            ${{ runner.temp }}/jesses-grav1synth/**/*.log
            ${{ runner.temp }}/jesses-grav1synth/delivery/qualification/*
            ${{ runner.temp }}/jesses-x264/build.log
            ${{ runner.temp }}/jesses-svt/build.log
            ${{ runner.temp }}/jesses-av1an/**/*.log
            ${{ runner.temp }}/jesses-scorers/*.log
            ${{ runner.temp }}/jesses-av1an-scorers/**/*.log
            ${{ runner.temp }}/jesses-qtgmc/**/*.log
            ${{ runner.temp }}/jesses-av1an-qtgmc/**/*.log
            ${{ runner.temp }}/jesses-vship/**/*.log
            ${{ runner.temp }}/jesses-av1an-vship/**/*.log
            ${{ runner.temp }}/jesses-mkvmerge/**/qualification/*.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: jesses-x86_64-pc-windows-msvc-${{ inputs.profile }}-unsigned
          path: |
            ${{ runner.temp }}/jesses-packages/*.zip
            ${{ runner.temp }}/jesses-packages/*.json
            ${{ runner.temp }}/jesses-packages/*.md
            ${{ runner.temp }}/jesses-packages/LICENSE
            ${{ runner.temp }}/jesses-packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
