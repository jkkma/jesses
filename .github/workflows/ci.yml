name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-names:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tracked files and new commits
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          sh scripts/check-repository-names.sh --tree HEAD
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"
            head=HEAD
            if [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
              base="refs/remotes/origin/$DEFAULT_BRANCH"
            fi
          fi
          # A force-push may leave its previous tip outside the fetched refs.
          if ! git cat-file -e "$base^{commit}"; then
            git fetch --no-tags origin "$base"
          fi
          sh scripts/check-repository-names.sh --commits "$base..$head"

  frontend:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pnpm install --frozen-lockfile
      - run: python scripts/test-ipc-registration.py
      - run: python scripts/test-package-av1-codecs.py
      - run: python scripts/test-package-grav1synth.py
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test

  desktop:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify Windows package isolation checks
        run: python scripts/test-qualify-windows-clean.py
      - name: Verify packaged MKVToolNix and optional GPU scorers
        run: |
          python scripts/test-package-mkvmerge.py
          python scripts/test-package-vship.py
      - run: pnpm contracts:check
      - name: Check the native executable with embedded frontend
        run: pnpm tauri build --debug --no-bundle --target x86_64-pc-windows-msvc
      - name: Verify repeated Windows launches preserve Scoop history
        run: |
          python scripts/test-windows-single-instance-harness.py
          python scripts/test-windows-single-instance.py --executable target/x86_64-pc-windows-msvc/debug/jesses.exe --root target/single-instance-${{ github.run_id }}-${{ github.run_attempt }}
