name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pnpm install --frozen-lockfile
      - run: python scripts/test-ipc-registration.py
      - run: python scripts/test-package-av1-codecs.py
      - run: python scripts/test-package-grav1synth.py
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test

  desktop:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify Windows package isolation checks
        run: python scripts/test-qualify-windows-clean.py
      - name: Verify packaged MKVToolNix and optional GPU scorers
        run: |
          python scripts/test-package-mkvmerge.py
          python scripts/test-package-vship.py
      - run: pnpm contracts:check
      - name: Check the native executable with embedded frontend
        run: pnpm tauri build --debug --no-bundle --target x86_64-pc-windows-msvc
      - name: Verify repeated Windows launches preserve Scoop history
        run: |
          python scripts/test-windows-single-instance-harness.py
          python scripts/test-windows-single-instance.py --executable target/x86_64-pc-windows-msvc/debug/jesses.exe --root target/single-instance-${{ github.run_id }}-${{ github.run_attempt }}
